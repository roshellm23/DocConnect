server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /appointments {
        proxy_pass http://backend-service;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /auth/ {
        proxy_pass http://backend-service;
    }

    location /doctors/ {
        proxy_pass http://backend-service;
    }

    location /appointments/ {
        proxy_pass http://backend-service;
    }

    location /admin/ {
        proxy_pass http://backend-service;
    }

    location /health {
        proxy_pass http://backend-service;
    }

    location /api/ {
        proxy_pass http://backend-service;
    }
}

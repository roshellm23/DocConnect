apiVersion: apps/v1
kind: Deployment
metadata:
  name: docconnect-frontend
  namespace: docconnect
  labels:
    app: docconnect-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docconnect-frontend
  template:
    metadata:
      labels:
        app: docconnect-frontend
    spec:
      containers:
        - name: frontend
          image: 755729228637.dkr.ecr.ap-south-1.amazonaws.com/docconnect-frontend:b3f55d6
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: docconnect
spec:
  type: NodePort
  selector:
    app: docconnect-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 31546

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: simone-infrastructure-viewer
rules:
- apiGroups: [""]
  resources: ["persistentvolumes", "nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]


apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: docconnect
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-eip-allocations: "eipalloc-07629f9f0195ab291"
    service.beta.kubernetes.io/aws-load-balancer-subnets: "subnet-087fca1824359d472"
spec:
  type: LoadBalancer
  selector:
    app: docconnect-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
      nodePort: 31546


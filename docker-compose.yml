services:
  backend:
    build: ./backend
    container_name: backend-container
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: host.docker.internal

  frontend:
    build: ./frontend
    container_name: frontend-container
    ports:
      - "5173:80"
    depends_on:
      - backend
    volumes:
      - ./frontend/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro